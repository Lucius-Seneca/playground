---
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: Format C++ files
        entry: clang-format
        language: system
        args: [-i, -Werror]
        files: \.(cpp|hpp|cc|c|h)$
      - id: buildifier
        name: Format Bazel files
        entry: buildifier
        files: \.(BUILD|WORKSPACE)$
        language: system
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
      - id: sort-simple-yaml
      - id: trailing-whitespace
